[project]
name = "eclass-mcp"
version = "0.1.0"
description = "MCP server για το Open eClass: μαθήματα, ανακοινώσεις, προθεσμίες, εργασίες, έγγραφα, μηνύματα"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Fotis Petrou" }]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "keyring>=24",
]

[project.urls]
Repository = "https://github.com/fotispetrou/eclass-mcp"

[project.scripts]
eclass-mcp = "eclass_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclass_mcp"]

[dependency-groups]
dev = ["pytest>=8"]
